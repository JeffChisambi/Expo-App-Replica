openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Authenticated student accounts
  - name: courses
    description: Student course catalog
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /students/me:
    get:
      operationId: getStudentProfile
      tags: [students]
      summary: Get or create the signed-in student profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The signed-in student's persisted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Authentication is required
  /courses:
    get:
      operationId: getCourses
      tags: [courses]
      summary: List courses and their availability
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCatalog"
        "401":
          description: Authentication is required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentProfile:
      type: object
      properties:
        studentId:
          type: string
        role:
          type: string
          enum: [student]
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required: [studentId, role, createdAt, lastSeenAt]
    Course:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isAvailable:
          type: boolean
      required: [id, name, isAvailable]
    CourseCatalog:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
      required: [courses]

