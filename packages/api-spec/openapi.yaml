openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: STEM SmartStudy local API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /courses:
    get:
      operationId: getCourses
      summary: List available study courses
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCatalog"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Course:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isAvailable:
          type: boolean
      required: [id, name, isAvailable]
    CourseCatalog:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
      required: [courses]
