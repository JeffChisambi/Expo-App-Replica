openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: STEM SmartStudy local API
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /courses:
    get:
      operationId: getCourses
      summary: List available study courses
      responses:
        "200":
          description: Course catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCatalog"
  /courses/{courseId}/questions:
    get:
      operationId: getCourseQuestions
      summary: Get random course questions for a quiz
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Quiz questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionCatalog"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Course:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        isAvailable:
          type: boolean
      required: [id, name, isAvailable]
    CourseCatalog:
      type: object
      properties:
        courses:
          type: array
          items:
            $ref: "#/components/schemas/Course"
      required: [courses]
    Question:
      type: object
      properties:
        id:
          type: string
        mainTopic:
          type: string
        subtopic:
          type: string
        questionText:
          type: string
        options:
          type: array
          items:
            type: string
        correctOption:
          type: string
        explanation:
          type: string
        difficulty:
          type: string
        marks:
          type: integer
        estimatedTimeSeconds:
          type: integer
      required: [id, mainTopic, subtopic, questionText, options, correctOption, explanation, difficulty, marks, estimatedTimeSeconds]
    QuestionCatalog:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
      required: [questions]
